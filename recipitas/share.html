<script>
"use strict";
// Read-only page for one shared recipe. The link's code lets Supabase return just this recipe.
const SUPABASE_URL = 'https://anshkqqfekiucjssaxeg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DpAMexAC3MgIT2nrit1Iyg_0v6hdyoG';
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ingText = (i) => [[i.quantity, i.unit, i.name].map((x) => (x || '').trim()).filter(Boolean).join(' '), [i.prep_notes, i.description].filter((x) => x && x.trim()).join('; ')].filter(Boolean).join(', ');
function show(msg) { $app.innerHTML = '<div class="empty">' + esc(msg) + '</div>'; }
(async () => {
  const token = new URLSearchParams(location.search).get('r') || '';
  if (!/^[0-9a-f-]{36}$/i.test(token)) return show('This recipe link is incomplete. Ask for it to be sent again.');
  let r;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/shared_recipe', {
      method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: token }) });
    if (!res.ok) throw new Error();
    r = await res.json();
  } catch (e) { return show('Couldn\'t load the recipe. Check your connection and try again.'); }
  if (!r) return show('This recipe is no longer shared.');
  document.title = r.name + ' · Flavored With Love';
  const meta = [['Prep', r.prep_time], ['Cook', r.cook_time], ['Total', r.total_time], ['Serves', r.servings], ['Category', r.category]].filter((m) => m[1]);
  const ings = r.ingredients || [], steps = r.steps || [];
  const isUrl = /^https?:\/\//i.test(r.source || '');
  $app.innerHTML = `<article class="typed">
    <h2>${esc(r.name)}</h2>
    ${r.description ? `<p>${esc(r.description)}</p>` : ''}
    ${meta.length ? `<div class="meta">${meta.map((m) => `<span>${m[0]}: <b>${esc(m[1])}</b></span>`).join('')}</div>` : ''}
    ${r.source ? `<div class="muted">Source: ${isUrl ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source)}</a>` : esc(r.source)}</div>` : ''}
    <h3>Ingredients</h3>
    ${ings.length ? `<ul class="ing">${ings.map((i) => `<li><span>${esc(ingText(i))}</span></li>`).join('')}</ul>` : '<p class="muted">No ingredients listed.</p>'}
    <h3>Instructions</h3>
    ${steps.length ? `<ol class="steps">${steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>` : '<p class="muted">No instructions listed.</p>'}
    ${r.notes ? `<h3>Notes</h3><p style="white-space:pre-wrap">${esc(r.notes)}</p>` : ''}
  </article><p class="from">Shared with love from our kitchen</p>`;
})();
</script>
</body>
</html>
