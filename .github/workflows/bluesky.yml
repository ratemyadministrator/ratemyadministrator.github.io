name: Post to Bluesky

# Publishes at most one queued post per run from social/queue.json.
on:
  schedule:
    - cron: "17 17 * * *"   # about 9-10 AM Pacific
    - cron: "47 2 * * *"    # about 6-7 PM Pacific (reposts and fresh candidates; still one post a day max)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next post
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python3 scripts/bsky_post.py
      - name: Save queue changes
        run: |
          if ! git diff --quiet social/; then
            git config user.name "ratemyadministrator"
            git config user.email "ratemyadministrator@users.noreply.github.com"
            git add social/
            git commit -m "Bluesky: mark post as published"
            git push
          fi
